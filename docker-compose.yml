#the llm link and llm api keys are disabled, Please use your api key before running
services:
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.9.7
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build: .
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - LLM_BASE_URL= // *************************************
      - LLM_API_KEY=gsk_placeholder (had to do this coz it cannot push on git) **********************
      - LLM_MODEL_NAME=llama-3.1-8b-instant
      - QDRANT_COLLECTION_NAME=ground_truth_precedents
      - REDIS_QUEUE_NAME=audit_queue
      - REDIS_RESULTS_PREFIX=audit_result
      - FASTEMBED_MODEL_NAME=BAAI/bge-small-en-v1.5
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./sample_outputs:/app/sample_outputs

volumes:
  redis_data:
  qdrant_data: